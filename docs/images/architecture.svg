<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" font-family="'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="260" fill="#ffffff"/>

  <!-- 使用者瀏覽器 -->
  <rect x="20" y="90" width="150" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="95" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">使用者</text>
  <text x="95" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">瀏覽器</text>

  <!-- arrow 1 -->
  <line x1="170" y1="130" x2="248" y2="130" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="209" y="118" text-anchor="middle" font-size="13" fill="#4b5563">HTTP</text>

  <!-- 前端 -->
  <rect x="250" y="80" width="190" height="100" rx="10" fill="#eafbf3" stroke="#42b883" stroke-width="2"/>
  <text x="345" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">前端</text>
  <text x="345" y="140" text-anchor="middle" font-size="13" fill="#35495e">Vue 3 SPA</text>
  <text x="345" y="160" text-anchor="middle" font-size="12" fill="#6b7280">Vite + Pinia + Router</text>

  <!-- arrow 2 -->
  <line x1="440" y1="130" x2="538" y2="130" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="489" y="112" text-anchor="middle" font-size="13" fill="#4b5563">REST API</text>
  <text x="489" y="128" text-anchor="middle" font-size="12" fill="#6b7280">(JWT 驗證)</text>

  <!-- 後端 -->
  <rect x="540" y="80" width="190" height="100" rx="10" fill="#fff4e5" stroke="#f5a623" stroke-width="2"/>
  <text x="635" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">後端</text>
  <text x="635" y="140" text-anchor="middle" font-size="13" fill="#92400e">Spring Boot</text>
  <text x="635" y="160" text-anchor="middle" font-size="12" fill="#6b7280">Java 21 + Spring Data JPA</text>

  <!-- arrow 3 -->
  <line x1="730" y1="130" x2="818" y2="130" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="774" y="118" text-anchor="middle" font-size="13" fill="#4b5563">JDBC</text>

  <!-- 資料庫 (cylinder) -->
  <g>
    <path d="M820,100 a70,14 0 0 1 140,0 v70 a70,14 0 0 1 -140,0 z" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <ellipse cx="890" cy="100" rx="70" ry="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="890" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">資料庫</text>
    <text x="890" y="160" text-anchor="middle" font-size="12" fill="#3730a3">MSSQL Server</text>
  </g>
</svg>
